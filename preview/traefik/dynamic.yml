# Traefik file-provider config (mounted read-only into the traefik container).
# The static config lives as CLI flags in docker-compose.infra.yml; this file
# holds the bits that are convenient to edit without restarting Traefik.

http:
  middlewares:
    # Optional HTTP basic auth for previews. Attach it per PR with the
    # middleware label in docker-compose.app.yml. Generate a users line with:
    #   htpasswd -nB previewuser
    # and paste the "user:$2y$..." output below (escape every $ as $$ if you
    # ever move this into a compose label instead of this file).
    preview-auth:
      basicAuth:
        users:
          - "previewuser:$2y$05$REPLACE_WITH_A_REAL_BCRYPT_HASH_FROM_HTPASSWD"

tls:
  options:
    default:
      minVersion: VersionTLS12
