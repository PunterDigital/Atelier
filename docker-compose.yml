# One-command self-host: docker compose up
#
# Defaults work out of the box for a local instance. Override the password
# (and anything else) with a .env file next to this compose file - see
# .env.example. Change POSTGRES_PASSWORD before exposing this to a network.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier}
      POSTGRES_DB: ${POSTGRES_DB:-atelier}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelier} -d ${POSTGRES_DB:-atelier}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD:-atelier}@postgres:5432/${POSTGRES_DB:-atelier}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD:-atelier}@postgres:5432/${POSTGRES_DB:-atelier}
      # Change this before exposing the instance anywhere - see .env.example
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-atelier-dev-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
