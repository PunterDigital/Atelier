# The gate, in the exact order CONTRIBUTING.md defines it. Every step must pass;
# nothing here may be weakened to get a green run.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Billing fixture suite
        run: pnpm test:billing

      - name: Production build
        run: pnpm build

  # The seed is onboarding: if it breaks, the demo and every first-run
  # instance break with it, so CI proves it works
  # against a real Postgres - twice, because it must also be idempotent.
  seed:
    runs-on: [self-hosted, linux]
    # The runner is containerized, so the job must run in a container on the
    # same Docker network as the service - "localhost" inside the runner
    # container can't reach a port published on the host. The service is
    # reached by its alias ("postgres"), so no host port is published and
    # concurrent runs on one machine can't collide on 5432.
    container: node:24
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clerq
          POSTGRES_PASSWORD: clerq
          POSTGRES_DB: clerq
        options: >-
          --health-cmd "pg_isready -U clerq -d clerq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clerq:clerq@postgres:5432/clerq
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Seed is idempotent
        run: pnpm db:seed

      - name: Invoice numbering is concurrency-safe
        run: pnpm exec tsx scripts/check-numbering-concurrency.ts
