# The gate, in the exact order CONTRIBUTING.md defines it. Every step must pass;
# nothing here may be weakened to get a green run.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Billing fixture suite
        run: pnpm test:billing

      - name: Production build
        run: pnpm build

  # The seed is onboarding: if it breaks, the demo and every first-run
  # instance break with it, so CI proves it works
  # against a real Postgres - twice, because it must also be idempotent.
  seed:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clerq
          POSTGRES_PASSWORD: clerq
          POSTGRES_DB: clerq
        options: >-
          --health-cmd "pg_isready -U clerq -d clerq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clerq:clerq@postgres:5432/clerq
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real
    steps:
      # The runner is a container on the host's Docker daemon, so it can't
      # reach the service through a host-published port ("localhost" is the
      # runner container's own loopback) and job containers don't work either
      # (the runner's externals mount resolves against the host filesystem).
      # Instead, attach the runner container to the job's service network so
      # the "postgres" alias resolves directly - and detach again at the end
      # so the runner can tear the network down cleanly.
      - name: Join the service network
        run: docker network connect ${{ job.services.postgres.network }} "$(cat /etc/hostname)"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Seed is idempotent
        run: pnpm db:seed

      - name: Invoice numbering is concurrency-safe
        run: pnpm exec tsx scripts/check-numbering-concurrency.ts

      - name: Leave the service network
        if: always()
        run: docker network disconnect ${{ job.services.postgres.network }} "$(cat /etc/hostname)" || true
