# Spin up (or refresh) a preview instance for a pull request.
#
# On every open/push/reopen of a PR this builds the PR's code into an image,
# then deploys an isolated instance - its own database seeded with the rich
# Acme dataset, reachable at pr-<n>.<PREVIEW_BASE_DOMAIN> - and comments the URL
# on the PR. The matching teardown workflow removes it when the PR closes.
#
# Prerequisites (see preview/README.md):
#   - a self-hosted runner on the preview host, with the infra brought up
#   - repo variable  PREVIEW_BASE_DOMAIN         (e.g. preview.useclerq.net)
#   - repo secrets   PREVIEW_POSTGRES_PASSWORD, PREVIEW_BETTER_AUTH_SECRET
name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Never build or run untrusted fork code on the preview host: it would expose
# the runner and secrets. Previews are for same-repo PRs only.
permissions:
  contents: read
  packages: write
  pull-requests: write

# One deploy per PR at a time; a new push cancels an in-flight deploy.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Inert until an operator opts in by setting the PREVIEW_BASE_DOMAIN repo
    # variable (see preview/README.md). Until then the job is skipped, not
    # failed, so previews never redden CI before the host is configured.
    # Also excludes fork PRs so untrusted code never runs on the host.
    if: >-
      vars.PREVIEW_BASE_DOMAIN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          # Preview the PR's own head, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Needed for the runner-side migrate + seed of the preview database.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/punterdigital/clerq:pr-${{ github.event.number }}
          # Reuse the same GitHub Actions build cache as the release build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy preview
        env:
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          IMAGE: ghcr.io/punterdigital/clerq:pr-${{ github.event.number }}
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: bash preview/scripts/preview-deploy.sh

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
        with:
          script: |
            const host = `pr-${context.issue.number}.${process.env.PREVIEW_BASE_DOMAIN}`;
            const marker = '<!-- clerq-preview -->';
            const body = [
              marker,
              `### Preview instance ready`,
              ``,
              `**URL:** https://${host}`,
              ``,
              `Seeded with the Acme dataset. Sign in with:`,
              `\`owner@acme.test\` / \`acme-demo-1234\``,
              ``,
              `_Updates on every push; torn down when this PR closes._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
