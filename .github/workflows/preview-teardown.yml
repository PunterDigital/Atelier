# Remove a PR's preview instance when the pull request closes (merged or not).
#
# Tearing down on any close - not just merge - reclaims the container and
# database whether the PR shipped or was abandoned. The scheduled reaper
# (preview-reap.yml) is the backstop for closes this webhook misses.
name: Preview teardown

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  teardown:
    # Inert until an operator sets PREVIEW_BASE_DOMAIN (see preview/README.md),
    # matching the deploy workflow's opt-in. Fork PRs are excluded.
    if: >-
      vars.PREVIEW_BASE_DOMAIN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Tear down preview
        env:
          PR_NUMBER: ${{ github.event.number }}
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
        run: bash preview/scripts/preview-teardown.sh

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- clerq-preview -->';
            const body = `${marker}\n### Preview instance torn down\n\nThe preview for this PR has been removed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
