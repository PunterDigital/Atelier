# Build the app image from source instead of pulling the published one.
#
# Use it as an override on top of the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The base file pulls ghcr.io/punterdigital/clerq; this override replaces that
# with a local build of the runner stage. Handy for contributors and for
# trying local changes without publishing an image.

services:
  app:
    build:
      context: .
      target: runner
